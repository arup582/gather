name: gather
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: [./mvnw, spring-boot:run]
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - runtime-build:/workspace/target
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Set DEV_SEED_PASSWORD in .env}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy
  test-db:
    profiles: [test]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: gather_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d gather_test']
      interval: 2s
      timeout: 3s
      retries: 30
  backend-test:
    profiles: [test]
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: [./mvnw, -B, verify, -Pintegration]
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
    environment:
      TEST_DB_URL: jdbc:postgresql://test-db:5432/gather_test
      TEST_DB_USER: ${POSTGRES_USER}
      TEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres-data:
  maven-cache:
  runtime-build:
